set-option -g history-limit 100000

# Don't swallow input fullscreen TUIs want: modified keys (Shift+Enter) and mouse.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on

# Forward application-set titles to the outer terminal, with session name.
set -g set-titles on
set -g set-titles-string '#T - #S'
